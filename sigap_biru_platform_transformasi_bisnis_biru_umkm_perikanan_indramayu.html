                        placeholder="Masukkan email pengelola..."
                        disabled={remainingLockSeconds > 0}
                        className="w-full pl-10 pr-3.5 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-sky-600 disabled:bg-slate-100"
                        required
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">Password Administrator *</label>
                    <div className="relative">
                      <Lock className="w-4 h-4 text-slate-400 absolute left-3.5 top-2.5" />
                      <input
                        type={showPassword ? 'text' : 'password'}
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        placeholder="Masukkan password pengelola..."
                        disabled={remainingLockSeconds > 0}
                        className="w-full pl-10 pr-10 py-2.5 border border-slate-300 rounded-xl focus:outline-none focus:border-sky-600 disabled:bg-slate-100"
                        required
                      />
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-700"
                      >
                        {showPassword ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 block mb-1">PIN Keamanan *</label>
                    <input
                      type={showPassword ? 'text' : 'password'}
                      inputMode="numeric"
                      value={pinInput}
                      onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ''))}
                      placeholder="Masukkan PIN keamanan angka..."
                      disabled={remainingLockSeconds > 0}
                      className="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl font-mono tracking-widest focus:outline-none focus:border-sky-600 disabled:bg-slate-100"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={loading || remainingLockSeconds > 0}
                    className="w-full bg-sky-600 hover:bg-sky-700 disabled:opacity-50 text-white font-extrabold py-3 rounded-xl shadow-xs transition text-sm"
                  >
                    {remainingLockSeconds > 0
                      ? `Terkunci Sementara (${remainingLockSeconds}d)`
                      : loading
                      ? 'Memverifikasi Kredensial...'
                      : 'Masuk ke Dashboard Pengelola'}
                  </button>
                </form>
              ) : (
                <div className="space-y-4 text-xs">
                  <div className="p-4 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-900 space-y-1">
                    <div className="font-extrabold text-sm">Sesi Pengelola SIGAP BIRU Aktif</div>
                    <p>Anda telah terautentikasi sebagai Administrator Utama SIGAP BIRU.</p>
                  </div>

                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={onOpenDashboard}
                      className="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-extrabold py-3 rounded-xl"
                    >
                      Buka Dashboard Pengelola
                    </button>
                    <button
                      onClick={handleLogoutAdmin}
                      className="bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold px-4 py-3 rounded-xl"
                    >
                      Keluar Sesi Pengelola
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // DASHBOARD INTERNAL ADMINISTRATOR
    // ============================================================================
    function AdminDashboardView({
      user,
      publicUmkms,
      setPublicUmkms,
      siteSettings,
      setSiteSettings,
      adminLogs,
      logAdminAction,
      showToast,
      onExitAdmin
    }) {
      const [adminSubTab, setAdminSubTab] = useState('verifikasi');
      const [filterKec, setFilterKec] = useState('Semua');
      const [filterStatus, setFilterStatus] = useState('Semua');
      const [rejectionNotes, setRejectionNotes] = useState({});
      const [editingSettings, setEditingSettings] = useState(siteSettings);

      useEffect(() => {
        setEditingSettings(siteSettings);
      }, [siteSettings]);

      const filteredAdminData = useMemo(() => {
        return publicUmkms.filter((u) => {
          if (filterKec !== 'Semua' && u.kecamatan !== filterKec) return false;
          if (filterStatus !== 'Semua' && u.statusVerifikasi !== filterStatus) return false;
          return true;
        });
      }, [publicUmkms, filterKec, filterStatus]);

      const handleVerifyUmkm = async (umkm, newStatus) => {
        const note =
          newStatus === 'Terverifikasi'
            ? 'Data dan titik koordinat lokasi telah diverifikasi oleh Pengelola SIGAP BIRU.'
            : rejectionNotes[umkm.id] || 'Mohon periksa kembali kelengkapan alamat dan titik koordinat lokasi usaha Anda.';

        const updatedUmkms = publicUmkms.map((u) =>
          u.id === umkm.id
            ? { ...u, statusVerifikasi: newStatus, catatanVerifikasi: note, verifiedAt: new Date().toISOString() }
            : u
        );
        setPublicUmkms(updatedUmkms);
        saveLocal('umkm_registry', updatedUmkms);

        if (hasFirebaseEnv && db) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'umkm_registry', umkm.id);
            await updateDoc(docRef, {
              statusVerifikasi: newStatus,
              catatanVerifikasi: note,
              verifiedAt: new Date().toISOString()
            });
          } catch (e) {}
        }

        await logAdminAction(`Ubah Status UMKM: ${newStatus}`, `UMKM: ${umkm.namaUmkm} -> ${newStatus}`);
        showToast(`Status ${umkm.namaUmkm} diubah menjadi ${newStatus}.`, 'success');
      };

      const handleDeleteUmkm = async (umkm) => {
        const updatedUmkms = publicUmkms.filter((u) => u.id !== umkm.id);
        setPublicUmkms(updatedUmkms);
        saveLocal('umkm_registry', updatedUmkms);

        if (hasFirebaseEnv && db) {
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'umkm_registry', umkm.id);
            await deleteDoc(docRef);
          } catch (e) {}
        }
        await logAdminAction('Hapus Data UMKM', `Menghapus ${umkm.namaUmkm}`);
        showToast(`Data ${umkm.namaUmkm} dihapus.`, 'info');
      };

      const handleExportCSV = () => {
        const headers = [
          'ID_UMKM', 'Nama_UMKM', 'Nama_Pemilik', 'Telepon_WA', 'Email',
          'Jenis_Usaha', 'Produk_Utama', 'Kecamatan', 'Desa', 'Alamat',
          'Kapasitas_Bulanan', 'Skala_Usaha', 'Latitude', 'Longitude',
          'Status_Verifikasi', 'Skor_BLUE_SUSTAINABILITY_CHECK_Terakhir', 'Tanggal_Daftar'
        ];

        const rows = filteredAdminData.map((u) => [
          u.id,
          `"${(u.namaUmkm || '').replace(/"/g, '""')}"`,
          `"${(u.namaPemilik || '').replace(/"/g, '""')}"`,
          `"${(u.teleponWa || '').replace(/"/g, '""')}"`,
          `"${(u.email || '').replace(/"/g, '""')}"`,
          `"${(u.jenisUsaha || '').replace(/"/g, '""')}"`,
          `"${(u.produkUtama || '').replace(/"/g, '""')}"`,
          `"${(u.kecamatan || '').replace(/"/g, '""')}"`,
          `"${(u.desa || '').replace(/"/g, '""')}"`,
          `"${(u.alamatUsaha || '').replace(/"/g, '""')}"`,
          `"${(u.kapasitasBulanan || '').replace(/"/g, '""')}"`,
          `"${(u.skalaUsaha || '').replace(/"/g, '""')}"`,
          u.lat,
          u.lng,
          u.statusVerifikasi,
          u.lastScore ?? '',
          u.createdAt || ''
        ]);

        const csvString = [headers.join(','), ...rows.map((r) => r.join(','))].join('\n');
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SIGAP_BIRU_Database_UMKM_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('File CSV berhasil diunduh.', 'success');
      };

      const handleExportExcel = () => {
        const tableRows = filteredAdminData
          .map(
            (u) => `
          <tr>
            <td>${escapeXml(u.id)}</td>
            <td>${escapeXml(u.namaUmkm)}</td>
            <td>${escapeXml(u.namaPemilik)}</td>
            <td>${escapeXml(u.teleponWa)}</td>
            <td>${escapeXml(u.jenisUsaha)}</td>
            <td>${escapeXml(u.produkUtama)}</td>
            <td>${escapeXml(u.kecamatan)}</td>
            <td>${escapeXml(u.desa)}</td>
            <td>${escapeXml(u.kapasitasBulanan)}</td>
            <td>${escapeXml(u.lat)}</td>
            <td>${escapeXml(u.lng)}</td>
            <td>${escapeXml(u.statusVerifikasi)}</td>
            <td>${escapeXml(u.lastScore ?? '-')}</td>
          </tr>`
          )
          .join('');

        const excelHtml = `
          <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">
          <head><meta charset="UTF-8"></head>
          <body>
            <table border="1">
              <thead>
                <tr style="background:#0284c7;color:#ffffff;font-weight:bold;">
                  <th>ID</th><th>Nama UMKM</th><th>Nama Pemilik</th><th>Telepon/WA</th>
                  <th>Jenis Usaha</th><th>Produk Utama</th><th>Kecamatan</th><th>Desa</th>
                  <th>Kapasitas Bulanan</th><th>Latitude</th><th>Longitude</th>
                  <th>Status Verifikasi</th><th>Skor BLUE SUSTAINABILITY CHECK (%)</th>
                </tr>
              </thead>
              <tbody>${tableRows}</tbody>
            </table>
          </body></html>
        `;

        const blob = new Blob([excelHtml], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SIGAP_BIRU_Spreadsheet_${new Date().toISOString().slice(0, 10)}.xls`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('File Spreadsheet Excel (.xls) berhasil diunduh.', 'success');
      };

      const handleExportGeoJSON = () => {
        const geojson = {
          type: 'FeatureCollection',
          name: 'SIGAP_BIRU_Indramayu',
          features: filteredAdminData.map((u) => ({
            type: 'Feature',
            properties: {
              id: u.id,
              namaUmkm: u.namaUmkm,
              kecamatan: u.kecamatan,
              desa: u.desa,
              jenisUsaha: u.jenisUsaha,
              produkUtama: u.produkUtama,
              kapasitasBulanan: u.kapasitasBulanan,
              statusVerifikasi: u.statusVerifikasi,
              lastScore: u.lastScore ?? null
            },
            geometry: {
              type: 'Point',
              coordinates: [Number(u.lng), Number(u.lat)]
            }
          }))
        };

        const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/geo+json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SIGAP_BIRU_Geospasial_${new Date().toISOString().slice(0, 10)}.geojson`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('File Spasial GeoJSON berhasil diunduh.', 'success');
      };

      const handleSaveSiteSettings = async (e) => {
        e.preventDefault();
        setSiteSettings(editingSettings);
        saveLocal('site_settings', editingSettings);
        if (hasFirebaseEnv && db) {
          try {
            const settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'site_settings', 'main');
            await setDoc(settingsDocRef, editingSettings, { merge: true });
          } catch (e) {}
        }
        showToast('Pengaturan website dan informasi kontak pemerintah berhasil diperbarui.', 'success');
      };

      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-sky-600 to-cyan-600 text-white p-5 rounded-2xl shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <span className="text-[11px] uppercase tracking-wider text-yellow-300 font-extrabold">
                Panel Kendali Internal &bull; Terlindungi Autentikasi Pengelola
              </span>
              <h1 className="text-xl font-extrabold mt-0.5">
                Dashboard Pengelola & Basis Data Kebijakan SIGAP BIRU
              </h1>
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => setAdminSubTab('verifikasi')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold ${
                  adminSubTab === 'verifikasi' ? 'bg-yellow-300 text-slate-950' : 'bg-white/15 text-white'
                }`}
              >
                Verifikasi UMKM ({publicUmkms.length})
              </button>
              <button
                onClick={() => setAdminSubTab('ekspor')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold ${
                  adminSubTab === 'ekspor' ? 'bg-yellow-300 text-slate-950' : 'bg-white/15 text-white'
                }`}
              >
                Ekspor Data & Kebijakan
              </button>
              <button
                onClick={() => setAdminSubTab('cms')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold ${
                  adminSubTab === 'cms' ? 'bg-yellow-300 text-slate-950' : 'bg-white/15 text-white'
                }`}
              >
                Kelola Konten & Kontak Pemerintah
              </button>
              <button
                onClick={onExitAdmin}
                className="px-3 py-2 rounded-xl text-xs font-semibold bg-white/15 hover:bg-white/25 text-white"
              >
                Tutup
              </button>
            </div>
          </div>

          {adminSubTab === 'verifikasi' && (
            <div className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs space-y-4">
              <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3">
                <h3 className="text-sm font-bold text-slate-900">
                  Daftar Pendaftaran UMKM & Verifikasi Titik Koordinat
                </h3>
                <div className="flex flex-wrap gap-2 text-xs">
                  <select
                    value={filterKec}
                    onChange={(e) => setFilterKec(e.target.value)}
                    className="px-3 py-1.5 border border-slate-300 rounded-lg bg-white"
                  >
                    <option value="Semua">Semua Kecamatan</option>
                    {(siteSettings.kecamatanList || DEFAULT_KECAMATAN).map((k) => (
                      <option key={k.id} value={k.name}>{k.name}</option>
                    ))}
                  </select>
                  <select
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="px-3 py-1.5 border border-slate-300 rounded-lg bg-white"
                  >
                    <option value="Semua">Semua Status Verifikasi</option>
                    <option value="Menunggu Verifikasi">Belum Terverifikasi</option>
                    <option value="Terverifikasi">Terverifikasi</option>
                    <option value="Perlu Perbaikan">Perlu Perbaikan</option>
                  </select>
                </div>
              </div>

              {filteredAdminData.length === 0 ? (
                <p className="text-xs text-slate-400 py-8 text-center">
                  Tidak ada data UMKM pada filter ini.
                </p>
              ) : (
                <div className="space-y-3">
                  {filteredAdminData.map((u) => (
                    <div
                      key={u.id}
                      className="p-4 rounded-xl bg-sky-50/40 border border-sky-200 flex flex-col lg:flex-row lg:items-center justify-between gap-4 text-xs"
                    >
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="font-extrabold text-sm text-slate-900">{u.namaUmkm}</span>
                          <span
                            className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${
                              u.statusVerifikasi === 'Terverifikasi'
                                ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                                : u.statusVerifikasi === 'Perlu Perbaikan'
                                ? 'bg-amber-100 text-amber-800 border-amber-300'
                                : 'bg-sky-100 text-sky-800 border-sky-300'
                            }`}
                          >
                            {u.statusVerifikasi === 'Menunggu Verifikasi' ? 'Belum Terverifikasi' : u.statusVerifikasi}
                          </span>
                        </div>
                        <div className="text-slate-600">
                          Pemilik: <strong>{u.namaPemilik}</strong> ({u.teleponWa}) &bull; Kecamatan: <strong>{u.kecamatan}</strong> ({u.desa})
                        </div>
                        <div className="text-slate-600">
                          Jenis: {u.jenisUsaha} &bull; Produk: {u.produkUtama} &bull; Kapasitas: {u.kapasitasBulanan || '-'}
                        </div>
                        <div className="text-[11px] font-mono text-slate-500">
                          Koordinat GPS: {u.lat}, {u.lng}
                        </div>
                      </div>

                      <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 shrink-0">
                        <input
                          type="text"
                          placeholder="Alasan perbaikan (jika ditolak)..."
                          value={rejectionNotes[u.id] || ''}
                          onChange={(e) => setRejectionNotes({ ...rejectionNotes, [u.id]: e.target.value })}
                          className="px-2.5 py-1.5 border border-slate-300 rounded-lg bg-white text-xs"
                        />
                        <button
                          onClick={() => handleVerifyUmkm(u, 'Terverifikasi')}
                          className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg"
                        >
                          Setujui & Tampilkan di Peta
                        </button>
                        <button
                          onClick={() => handleVerifyUmkm(u, 'Perlu Perbaikan')}
                          className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg"
                        >
                          Minta Perbaikan
                        </button>
                        <button
                          onClick={() => handleDeleteUmkm(u)}
                          className="bg-red-100 hover:bg-red-200 text-red-700 font-bold px-2.5 py-1.5 rounded-lg"
                        >
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {adminSubTab === 'ekspor' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div className="lg:col-span-7 bg-white p-5 rounded-xl border border-sky-200 shadow-xs space-y-4">
                <h3 className="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">
                  Unduh Salinan Basis Data ke Perangkat Pengelola
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                  <button
                    onClick={handleExportExcel}
                    className="p-4 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-left flex items-center gap-3 transition"
                  >
                    <FileSpreadsheet className="w-7 h-7 text-emerald-700 shrink-0" />
                    <div>
                      <div className="font-bold text-xs text-emerald-950">Unduh Spreadsheet Excel (.xls)</div>
                      <div className="text-[11px] text-emerald-700">Tabel rapi siap olah di Microsoft Excel</div>
                    </div>
                  </button>

                  <button
                    onClick={handleExportCSV}
                    className="p-4 rounded-xl bg-sky-50 hover:bg-sky-100 border border-sky-200 text-left flex items-center gap-3 transition"
                  >
                    <Download className="w-7 h-7 text-sky-700 shrink-0" />
                    <div>
                      <div className="font-bold text-xs text-sky-950">Unduh Data Lengkap (.csv)</div>
                      <div className="text-[11px] text-sky-700">Format standar analisis statistik</div>
                    </div>
                  </button>

                  <button
                    onClick={handleExportGeoJSON}
                    className="p-4 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-left flex items-center gap-3 transition"
                  >
                    <Globe className="w-7 h-7 text-amber-700 shrink-0" />
                    <div>
                      <div className="font-bold text-xs text-amber-950">Unduh Spasial (.geojson)</div>
                      <div className="text-[11px] text-amber-800">Untuk QGIS / ArcGIS / Analisis Spasial</div>
                    </div>
                  </button>

                  <button
                    onClick={() => window.print()}
                    className="p-4 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-300 text-left flex items-center gap-3 transition"
                  >
                    <FileText className="w-7 h-7 text-slate-700 shrink-0" />
                    <div>
                      <div className="font-bold text-xs text-slate-900">Cetak Laporan PDF Kebijakan</div>
                      <div className="text-[11px] text-slate-600">Laporan agregat untuk pemangku kepentingan</div>
                    </div>
                  </button>
                </div>
              </div>

              <div className="lg:col-span-5 bg-white p-5 rounded-xl border border-sky-200 shadow-xs space-y-3">
                <h3 className="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">
                  Rekapitulasi Agregat per Kecamatan
                </h3>
                <div className="space-y-2 text-xs">
                  {(siteSettings.kecamatanList || DEFAULT_KECAMATAN).map((k) => {
                    const inKec = publicUmkms.filter((u) => u.kecamatan === k.name);
                    const verCount = inKec.filter((u) => u.statusVerifikasi === 'Terverifikasi').length;
                    return (
                      <div key={k.id} className="flex items-center justify-between p-2 rounded bg-sky-50/50 border border-sky-100">
                        <span className="font-semibold text-slate-800">{k.name}</span>
                        <span className="text-slate-600">
                          Total: <strong>{inKec.length}</strong> | Terverifikasi: <strong className="text-emerald-700">{verCount}</strong>
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          {adminSubTab === 'cms' && (
            <form onSubmit={handleSaveSiteSettings} className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs space-y-5 text-xs">
              <h3 className="text-sm font-bold text-slate-900 border-b border-slate-100 pb-2">
                Pembaruan Konten Beranda & Informasi Kontak Pemerintah Kabupaten Indramayu
              </h3>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="sm:col-span-2">
                  <label className="font-bold text-slate-700 block mb-1">Judul Utama Beranda</label>
                  <input
                    type="text"
                    value={editingSettings.heroTitle || ''}
                    onChange={(e) => setEditingSettings({ ...editingSettings, heroTitle: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Nama Instansi Pemerintah</label>
                  <input
                    type="text"
                    value={editingSettings.govAgencyName || ''}
                    onChange={(e) => setEditingSettings({ ...editingSettings, govAgencyName: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Alamat Resmi Instansi</label>
                  <input
                    type="text"
                    value={editingSettings.govAgencyAddress || ''}
                    onChange={(e) => setEditingSettings({ ...editingSettings, govAgencyAddress: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg"
                  />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Nomor Kontak Resmi</label>
                  <input
                    type="text"
                    value={editingSettings.govAgencyContact || ''}
                    onChange={(e) => setEditingSettings({ ...editingSettings, govAgencyContact: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="bg-sky-600 hover:bg-sky-700 text-white font-extrabold px-5 py-2.5 rounded-xl"
              >
                Simpan Pembaruan Website & Kontak Pemerintah
              </button>
            </form>
          )}
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
