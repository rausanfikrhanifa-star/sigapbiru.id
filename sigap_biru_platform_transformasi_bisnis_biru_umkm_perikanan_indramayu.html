    async function sha256Hash(text) {
      const msgBuffer = new TextEncoder().encode(String(text));
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map((b) => b.toString(16).padStart(2, '0')).join('');
    }

    function CleanAiMessageRenderer({ text }) {
      if (!text) return null;

      const formatInline = (line) => {
        const cleaned = line.replace(/\*\*\*/g, '**').replace(/__/g, '');
        const parts = cleaned.split(/(\*\*[^*]+\*\*)/g);
        return parts.map((part, idx) => {
          if (part.startsWith('**') && part.endsWith('**')) {
            return (
              <strong key={idx} className="font-bold text-slate-900">
                {part.slice(2, -2)}
              </strong>
            );
          }
          return <span key={idx}>{part.replace(/\*/g, '')}</span>;
        });
      };

      const lines = String(text)
        .replace(/```[a-zA-Z]*\n?/g, '')
        .replace(/```/g, '')
        .split('\n');

      return (
        <div className="space-y-2 text-slate-800 leading-relaxed">
          {lines.map((rawLine, index) => {
            const line = rawLine.trim();
            if (!line) return <div key={index} className="h-1" />;

            if (/^[-=*_]{3,}$/.test(line)) {
              return <hr key={index} className="border-sky-200/70 my-2" />;
            }

            const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
            if (headingMatch) {
              const cleanTitle = headingMatch[2].replace(/[#*]/g, '').trim();
              return (
                <h4 key={index} className="font-bold text-sky-900 text-sm pt-1.5">
                  {cleanTitle}
                </h4>
              );
            }

            const numMatch = line.match(/^(\d+)[.)]\s+(.*)$/);
            if (numMatch) {
              return (
                <div key={index} className="flex items-start gap-2 pl-1">
                  <span className="font-bold text-sky-700 shrink-0">{numMatch[1]}.</span>
                  <div className="flex-1">{formatInline(numMatch[2])}</div>
                </div>
              );
            }

            const bulletMatch = line.match(/^[-*•]\s+(.*)$/);
            if (bulletMatch) {
              return (
                <div key={index} className="flex items-start gap-2 pl-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-sky-600 mt-2 shrink-0" />
                  <div className="flex-1">{formatInline(bulletMatch[1])}</div>
                </div>
              );
            }

            return (
              <p key={index} className="text-xs sm:text-sm leading-relaxed">
                {formatInline(line)}
              </p>
            );
          })}
        </div>
      );
    }

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }

    function PetaSigView({ user, isAdminSession, publicUmkms, siteSettings, setActiveTab, showToast }) {
      const [filterKecamatan, setFilterKecamatan] = useState('Semua');
      const [filterJenis, setFilterJenis] = useState('Semua');
      const [filterStatusVerifikasi, setFilterStatusVerifikasi] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');
      const [mapLayer, setMapLayer] = useState('satellite');
      const [showSimulationData, setShowSimulationData] = useState(false);
      const [selectedPin, setSelectedPin] = useState(null);
      const [showPublicProfileModal, setShowPublicProfileModal] = useState(null);

      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const markersLayerRef = useRef(null);
      const tileLayerRef = useRef(null);

      const getVerificationBadge = (status) => {
        if (status === 'Terverifikasi') {
          return { label: 'Terverifikasi', className: 'bg-emerald-100 text-emerald-800 border-emerald-300' };
        }
        if (status === 'Perlu Perbaikan') {
          return { label: 'Perlu Perbaikan', className: 'bg-amber-100 text-amber-900 border-amber-300' };
        }
        if (status === 'Simulasi') {
          return { label: 'Data Simulasi', className: 'bg-purple-100 text-purple-800 border-purple-300' };
        }
        return { label: 'Belum Terverifikasi', className: 'bg-sky-100 text-sky-800 border-sky-300' };
      };

      const accessibleUmkms = useMemo(() => {
        return publicUmkms.filter((u) => {
          const latNum = Number(u.lat);
          const lngNum = Number(u.lng);
          if (Number.isNaN(latNum) || Number.isNaN(lngNum) || !u.lat || !u.lng) return false;
          if (u.statusVerifikasi === 'Terverifikasi' && u.publicConsent !== false) return true;
          if (isAdminSession) return true;
          if (user && u.ownerUid === user.uid) return true;
          return false;
        });
      }, [publicUmkms, user, isAdminSession]);

      const activeDataset = useMemo(() => {
        const base = [...accessibleUmkms];
        if (showSimulationData) return [...base, ...SIMULATION_MARKERS];
        return base;
      }, [accessibleUmkms, showSimulationData]);

      const filteredPins = useMemo(() => {
        return activeDataset.filter((item) => {
          if (filterKecamatan !== 'Semua' && item.kecamatan !== filterKecamatan) return false;
          if (filterJenis !== 'Semua' && item.jenisUsaha !== filterJenis) return false;
          if (filterStatusVerifikasi !== 'Semua') {
            const normalized =
              item.statusVerifikasi === 'Menunggu Verifikasi' ? 'Belum Terverifikasi' : item.statusVerifikasi;
            if (normalized !== filterStatusVerifikasi) return false;
          }
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const matchName = (item.namaUmkm || '').toLowerCase().includes(q);
            const matchProd = (item.produkUtama || '').toLowerCase().includes(q);
            const matchKec = (item.kecamatan || '').toLowerCase().includes(q);
            if (!matchName && !matchProd && !matchKec) return false;
          }
          return true;
        });
      }, [activeDataset, filterKecamatan, filterJenis, filterStatusVerifikasi, searchQuery]);

      useEffect(() => {
        if (!window.L || !mapContainerRef.current) return;
        const L = window.L;

        if (!leafletMapRef.current) {
          const map = L.map(mapContainerRef.current, {
            center: [-6.345, 108.285],
            zoom: 11,
            zoomControl: true
          });
          leafletMapRef.current = map;
          markersLayerRef.current = L.layerGroup().addTo(map);
          setTimeout(() => map.invalidateSize(), 200);
        }

        const map = leafletMapRef.current;
        if (tileLayerRef.current) {
          map.removeLayer(tileLayerRef.current);
        }

        const standardRoadUrl = 'https://mt1.google.com/vt/lyrs=m&hl=id&x={x}&y={y}&z={z}';
        const satelliteHybridUrl = 'https://mt1.google.com/vt/lyrs=y&hl=id&x={x}&y={y}&z={z}';

        const layer = L.tileLayer(mapLayer === 'satellite' ? satelliteHybridUrl : standardRoadUrl, {
          maxZoom: 20,
          attribution:
            mapLayer === 'satellite'
              ? 'Citra Satelit &bull; BLUE MAP SIGAP BIRU Indramayu'
              : 'Peta Standar Jalan & Wilayah &bull; BLUE MAP SIGAP BIRU Indramayu'
        });

        layer.addTo(map);
        tileLayerRef.current = layer;
        setTimeout(() => map.invalidateSize(), 150);
      }, [mapLayer]);

      useEffect(() => {
        if (!window.L || !leafletMapRef.current || !markersLayerRef.current) return;
        const L = window.L;
        const layerGroup = markersLayerRef.current;
        layerGroup.clearLayers();

        filteredPins.forEach((umkm) => {
          const latNum = Number(umkm.lat);
          const lngNum = Number(umkm.lng);
          if (Number.isNaN(latNum) || Number.isNaN(lngNum)) return;

          const hotPinkIcon = L.divIcon({
            className: 'custom-blue-map-pink-pin',
            html: `
              <div style="
                position: relative;
                width: 24px;
                height: 24px;
                background: #FF1493;
                border: 3px solid #FFFFFF;
                border-radius: 9999px;
                box-shadow: 0 3px 10px rgba(255, 20, 147, 0.55), 0 1px 4px rgba(0,0,0,0.4);
                display: flex;
                align-items: center;
                justify-content: center;
              ">
                <div style="width: 7px; height: 7px; background: #FFFFFF; border-radius: 9999px;"></div>
              </div>
            `,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });

          const marker = L.marker([latNum, lngNum], { icon: hotPinkIcon });
          marker.on('click', () => setSelectedPin(umkm));
          marker.addTo(layerGroup);
        });
      }, [filteredPins]);

      const handleExportKML = () => {
        if (filteredPins.length === 0) {
          showToast('Tidak ada titik UMKM pada filter saat ini untuk diekspor ke KML.', 'info');
          return;
        }

        const placemarks = filteredPins
          .map((u) => {
            const scoreInfo =
              u.scoreConsent !== false && typeof u.lastScore === 'number'
                ? `${u.lastScore}%`
                : 'Tidak Dipublikasikan';
            const capInfo =
              u.capacityConsent !== false && u.kapasitasBulanan
                ? u.kapasitasBulanan
                : 'Tidak Dipublikasikan';

            return `
    <Placemark>
      <name>${escapeXml(u.namaUmkm)}</name>
      <description><![CDATA[
        <b>Kecamatan:</b> ${escapeXml(u.kecamatan || '-')}<br/>
        <b>Jenis Usaha:</b> ${escapeXml(u.jenisUsaha || '-')}<br/>
        <b>Produk Utama:</b> ${escapeXml(u.produkUtama || '-')}<br/>
        <b>Kapasitas Produksi:</b> ${escapeXml(capInfo)}<br/>
        <b>Skor BLUE SUSTAINABILITY CHECK:</b> ${escapeXml(scoreInfo)}<br/>
        <b>Status Verifikasi:</b> ${escapeXml(u.statusVerifikasi === 'Menunggu Verifikasi' ? 'Belum Terverifikasi' : u.statusVerifikasi)}
      ]]></description>
      <Point>
        <coordinates>${Number(u.lng)},${Number(u.lat)},0</coordinates>
      </Point>
    </Placemark>`;
          })
          .join('\n');

        const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>BLUE MAP SIGAP BIRU - Kabupaten Indramayu</name>
    <description>Peta Geospasial Persebaran UMKM Pengolahan Hasil Perikanan Kabupaten Indramayu</description>
    ${placemarks}
  </Document>
</kml>`;

        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BLUE_MAP_SIGAP_BIRU_Indramayu_${new Date().toISOString().slice(0, 10)}.kml`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('File KML BLUE MAP berhasil diunduh.', 'success');
      };

      const openInGoogleEarthWeb = (pin) => {
        const lat = Number(pin.lat);
        const lng = Number(pin.lng);
        const url = `https://earth.google.com/web/@${lat},${lng},15a,800d,35y,0h,0t,0r`;
        window.open(url, '_blank', 'noopener,noreferrer');
      };

      return (
        <div className="space-y-6">
          <section className="bg-white p-6 rounded-2xl border border-sky-200 shadow-xs space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-sky-100 pb-4">
              <div className="space-y-1">
                <div className="inline-flex items-center gap-1.5 bg-sky-100 text-sky-800 font-extrabold text-[11px] uppercase px-3 py-1 rounded-full">
                  <MapPin className="w-3.5 h-3.5 text-pink-600" />
                  <span>Sistem Informasi Geospasial Ekonomi Biru</span>
                </div>
                <h1 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                  BLUE MAP – Peta Geospasial Persebaran UMKM Perikanan Indramayu
                </h1>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={() => setActiveTab('profil')}
                  className="bg-yellow-300 hover:bg-yellow-200 text-slate-950 font-extrabold text-xs px-4 py-2.5 rounded-xl shadow-xs flex items-center gap-1.5"
                >
                  <Plus className="w-4 h-4" />
                  <span>Tambah / Perbarui Koordinat UMKM</span>
                </button>
                <button
                  onClick={handleExportKML}
                  className="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl flex items-center gap-1.5 shadow-xs transition"
                >
                  <Globe className="w-4 h-4 text-yellow-300" />
                  <span>Unduh KML (Google Earth)</span>
                </button>
              </div>
            </div>

            <p className="text-xs sm:text-sm text-slate-700 leading-relaxed">
              <b>BLUE MAP</b> merupakan peta geospasial yang menyajikan persebaran UMKM pengolahan hasil perikanan di wilayah pesisir Kabupaten Indramayu. Peta ini dikembangkan untuk mengidentifikasi lokasi, karakteristik, dan potensi UMKM secara spasial sebagai dasar pendataan, pemetaan kebutuhan, serta pendampingan transformasi bisnis biru yang lebih terarah dan berkelanjutan.
            </p>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
              <div className="bg-sky-50/70 p-3.5 rounded-xl border border-sky-200 text-xs flex items-start gap-2.5">
                <MapPin className="w-4 h-4 text-pink-600 shrink-0 mt-0.5" />
                <span>Menampilkan persebaran lokasi UMKM pengolahan hasil perikanan.</span>
              </div>
              <div className="bg-sky-50/70 p-3.5 rounded-xl border border-sky-200 text-xs flex items-start gap-2.5">
                <Package className="w-4 h-4 text-sky-700 shrink-0 mt-0.5" />
                <span>Menyediakan informasi karakteristik dan jenis produk UMKM.</span>
              </div>
              <div className="bg-sky-50/70 p-3.5 rounded-xl border border-sky-200 text-xs flex items-start gap-2.5">
                <Layers className="w-4 h-4 text-sky-700 shrink-0 mt-0.5" />
                <span>Membantu mengidentifikasi wilayah yang memiliki konsentrasi UMKM.</span>
              </div>
              <div className="bg-sky-50/70 p-3.5 rounded-xl border border-sky-200 text-xs flex items-start gap-2.5">
                <Compass className="w-4 h-4 text-sky-700 shrink-0 mt-0.5" />
                <span>Mendukung analisis spasial dan perencanaan pendampingan ekonomi biru.</span>
              </div>
            </div>
          </section>

    // ============================================================================
    // BAGIAN 3: BLUE SUSTAINABILITY CHECK
    // ============================================================================
    function AsesmenHijauCekView({
      user,
      myProfile,
      myAssessments,
      setMyAssessments,
      publicUmkms,
      setPublicUmkms,
      setActiveTab,
      showToast
    }) {
      const [businessScale, setBusinessScale] = useState(myProfile?.skalaUsaha || 'Mikro (Modal < Rp 1 Miliar)');
      const [answers, setAnswers] = useState({
        bahan_baku: null,
        energi: null,
        air: null,
        limbah: null,
        kemasan: null,
        pencatatan: null
      });
      const [submitting, setSubmitting] = useState(false);

      const latestAssessment = myAssessments.length > 0 ? myAssessments[0] : null;
      const allAnswered = Object.values(answers).every((v) => v !== null);

      const currentScorePreview = useMemo(() => {
        const vals = Object.values(answers).filter((v) => typeof v === 'number');
        if (vals.length === 0) return 0;
        return Math.round(vals.reduce((a, b) => a + b, 0) / 6);
      }, [answers]);

      const getReadinessCategory = (score) => {
        if (score >= 70) {
          return {
            label: 'Siap Bisnis Biru (Tinggi)',
            colorClass: 'bg-emerald-100 text-emerald-800 border-emerald-300',
            desc: 'Praktik efisiensi dan pengelolaan limbah usaha Anda sudah baik. Fokus selanjutnya adalah diversifikasi produk bernilai tambah dari hasil samping.'
          };
        }
        if (score >= 50) {
          return {
            label: 'Cukup Siap / Transisi (Sedang)',
            colorClass: 'bg-amber-100 text-amber-800 border-amber-300',
            desc: 'Sebagian praktik efisiensi sudah berjalan, namun masih ada celah pemborosan sumber daya atau limbah yang perlu dibenahi secara bertahap.'
          };
        }
        return {
          label: 'Perlu Pendampingan Prioritas (Awal)',
          colorClass: 'bg-red-100 text-red-800 border-red-300',
          desc: 'Usaha memerlukan perbaikan dasar segera pada pemisahan limbah, penghematan air/energi, dan pencatatan operasional.'
        };
      };

      const handleSaveAssessment = async () => {
        if (!allAnswered) {
          showToast('Mohon pilih jawaban pada keenam indikator sebelum menyimpan hasil BLUE SUSTAINABILITY CHECK.', 'warning');
          return;
        }
        if (!user) return;
        setSubmitting(true);

        try {
          const totalScore = Math.round(
            Object.values(answers).reduce((acc, v) => acc + Number(v), 0) / 6
          );
          const category = getReadinessCategory(totalScore);

          const strengths = [];
          const improvements = [];
          ASSESSMENT_INDICATORS.forEach((ind) => {
            const val = answers[ind.id];
            if (val === 100) strengths.push(ind.title);
            else if (val === 0) improvements.push(`${ind.title} (Prioritas Utama - 0%)`);
            else improvements.push(`${ind.title} (Tingkatkan dari 50% ke 100%)`);
          });

          const record = {
            id: 'ass_' + Date.now(),
            uid: user.uid,
            umkmId: myProfile?.id || null,
            namaUmkm: myProfile?.namaUmkm || 'UMKM Belum Terdaftar',
            kecamatan: myProfile?.kecamatan || '-',
            skalaUsaha: businessScale,
            scores: answers,
            totalScore,
            categoryLabel: category.label,
            strengths,
            improvements,
            createdAt: new Date().toISOString()
          };

          const updatedList = [record, ...myAssessments];
          setMyAssessments(updatedList);
          saveLocal('assessments', updatedList);

          if (myProfile?.id) {
            const updatedUmkms = publicUmkms.map((u) =>
              u.id === myProfile.id
                ? { ...u, lastScore: totalScore, lastAssessedAt: record.createdAt, skalaUsaha: businessScale }
                : u
            );
            setPublicUmkms(updatedUmkms);
            saveLocal('umkm_registry', updatedUmkms);
          }

          if (hasFirebaseEnv && db) {
            const assessColRef = collection(db, 'artifacts', appId, 'users', user.uid, 'assessments');
            await addDoc(assessColRef, record);
            if (myProfile?.id) {
              const umkmDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'umkm_registry', myProfile.id);
              await updateDoc(umkmDocRef, {
                lastScore: totalScore,
                lastAssessedAt: record.createdAt,
                skalaUsaha: businessScale
              });
            }
          }

          showToast(`Hasil BLUE SUSTAINABILITY CHECK (${totalScore}%) berhasil disimpan.`, 'success');
        } catch (err) {
          console.error('Error saving assessment:', err);
          showToast('Hasil asesmen disimpan secara lokal.', 'info');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <CheckSquare className="w-6 h-6 text-sky-600" />
                <span>BLUE SUSTAINABILITY CHECK – Asesmen Kesiapan Transformasi Bisnis Biru</span>
              </h1>
              <p className="text-xs text-slate-500 mt-0.5">
                Rumus perhitungan: Rata-rata bobot setara dari 6 indikator utama ((Indikator 1 + 2 + 3 + 4 + 5 + 6) / 6).
              </p>
            </div>
            <button
              onClick={() => setActiveTab('profil')}
              className="text-xs font-bold text-sky-800 bg-sky-50 hover:bg-sky-100 border border-sky-200 px-3.5 py-2 rounded-lg shrink-0"
            >
              {myProfile ? 'Perbarui Profil UMKM' : 'Lengkapi Profil UMKM Terlebih Dahulu'}
            </button>
          </div>

          <div className="bg-white p-4 rounded-xl border border-sky-200 shadow-xs grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-xs">
            <div className="bg-sky-50/60 p-3 rounded-lg border border-sky-100">
              <span className="text-slate-500 block">Nama Usaha:</span>
              <span className="font-bold text-slate-900">{myProfile?.namaUmkm || 'Belum diisi di Profil'}</span>
            </div>
            <div className="bg-sky-50/60 p-3 rounded-lg border border-sky-100">
              <span className="text-slate-500 block">Jenis Produk:</span>
              <span className="font-bold text-slate-900">{myProfile?.produkUtama || '-'}</span>
            </div>
            <div className="bg-sky-50/60 p-3 rounded-lg border border-sky-100">
              <span className="text-slate-500 block">Kecamatan:</span>
              <span className="font-bold text-slate-900">{myProfile?.kecamatan || '-'}</span>
            </div>
            <div className="bg-sky-50/60 p-3 rounded-lg border border-sky-100">
              <span className="text-slate-500 block">Kapasitas Produksi:</span>
              <span className="font-bold text-slate-900">{myProfile?.kapasitasBulanan || '-'}</span>
            </div>
            <div className="bg-sky-50/60 p-3 rounded-lg border border-sky-100">
              <label className="text-slate-500 block mb-1">Skala Usaha / Kelompok Modal:</label>
              <select
                value={businessScale}
                onChange={(e) => setBusinessScale(e.target.value)}
                className="w-full bg-white border border-slate-300 rounded px-2 py-1 font-semibold text-slate-800"
              >
                <option value="Mikro (Modal < Rp 1 Miliar)">Skala Mikro</option>
                <option value="Kecil (Modal Rp 1 - 5 Miliar)">Skala Kecil</option>
                <option value="Menengah">Skala Menengah</option>
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-7 space-y-4">
              {ASSESSMENT_INDICATORS.map((ind) => (
                <div key={ind.id} className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs space-y-3">
                  <div>
                    <h3 className="text-sm font-bold text-slate-900">{ind.title}</h3>
                    <p className="text-xs text-slate-500 mt-0.5">{ind.desc}</p>
                  </div>
                  <div className="space-y-2">
                    {ind.options.map((opt) => {
                      const selected = answers[ind.id] === opt.value;
                      return (
                        <label
                          key={opt.value}
                          className={`block p-3 rounded-xl border text-xs cursor-pointer transition ${
                            selected
                              ? 'bg-sky-50 border-sky-500 ring-1 ring-sky-500'
                              : 'bg-slate-50/70 hover:bg-sky-50/40 border-slate-200'
                          }`}
                        >
                          <div className="flex items-center gap-2 font-bold text-slate-900">
                            <input
                              type="radio"
                              name={ind.id}
                              checked={selected}
                              onChange={() => setAnswers((prev) => ({ ...prev, [ind.id]: opt.value }))}
                              className="text-sky-600"
                            />
                            <span>{opt.label}</span>
                          </div>
                          <p className="text-slate-600 pl-6 mt-1 leading-relaxed">{opt.detail}</p>
                        </label>
                      );
                    })}
                  </div>
                </div>
              ))}

              <div className="bg-white p-4 rounded-xl border border-sky-200 flex items-center justify-between">
                <div className="text-xs text-slate-600">

    function BiruAssistView({
      user,
      myProfile,
      myAssessments,
      mySimulations,
      myMonitorings,
      myChats,
      setMyChats,
      showToast
    }) {
      const [activeSessionId, setActiveSessionId] = useState(null);
      const [messages, setMessages] = useState([
        {
          role: 'assistant',
          text: 'Halo Bapak/Ibu pelaku UMKM pengolahan hasil perikanan di Kabupaten Indramayu! Saya BIRU ASSIST. Silakan ketik pertanyaan apa saja mengenai pengelolaan limbah ikan/udang, pemanfaatan kepala/tulang/kulit menjadi produk bernilai tambah, penghematan air/energi, atau pengembangan usaha Anda.',
          timestamp: new Date().toISOString()
        }
      ]);
      const [inputPrompt, setInputPrompt] = useState('');
      const [useProfileContext, setUseProfileContext] = useState(true);
      const [attachedImage, setAttachedImage] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);

      const samplePrompts = [
        'Bagaimana cara mengolah limbah cair cucian ikan agar tidak berbau sebelum dibuang?',
        'Kepala dan kulit udang sisa produksi terasi sebaiknya diolah menjadi produk apa dengan modal kecil?',
        'Bagaimana cara menghemat gas LPG dan listrik saat pengukusan serta penyimpanan ikan?',
        'Bagaimana tahapan membuat tepung tulang ikan yang aman pangan?'

      const handleStartNewChat = () => {
        setActiveSessionId(null);
        setMessages([
          {
            role: 'assistant',
            text: 'Percakapan baru dimulai. Silakan sampaikan permasalahan produksi, limbah, atau rencana pengembangan produk olahan perikanan Anda.',

      };

      const handleLoadSession = (session) => {
        setActiveSessionId(session.id);
        setMessages(session.messages || []);
      };

      const handleImageAttachment = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          const base64Data = result.split(',')[1];
          setAttachedImage({
            mimeType: file.type || 'image/jpeg',
            base64: base64Data,
            preview: result
          });
        };
        reader.readAsDataURL(file);
      };

      const handleSendMessage = async (customQuestion) => {
        const questionText = (typeof customQuestion === 'string' ? customQuestion : inputPrompt).trim();
        if (!questionText && !attachedImage) return;
        if (isGenerating) return;

        const userMsg = {
          role: 'user',
          text: questionText || '(Mengirim gambar untuk dianalisis)',
          hasImage: Boolean(attachedImage),
          timestamp: new Date().toISOString()
        };

        const updatedMessages = [...messages, userMsg];
        setMessages(updatedMessages);
        setInputPrompt('');
        const currentAttachment = attachedImage;
        setAttachedImage(null);
        setIsGenerating(true);

        try {
          let contextBlock = 'Pengguna bertanya tanpa menyertakan konteks profil spesifik.';
          if (useProfileContext) {
            const lastAss = myAssessments[0];
            const lastSim = mySimulations[0];
            const lastMon = myMonitorings[myMonitorings.length - 1];
            contextBlock = `
Konteks UMKM Pengguna (Gunakan secara relevan):
- Nama UMKM: ${myProfile?.namaUmkm || 'Belum terdaftar'}
- Jenis Usaha: ${myProfile?.jenisUsaha || '-'}
- Produk Utama: ${myProfile?.produkUtama || '-'}
- Kecamatan di Kab. Indramayu: ${myProfile?.kecamatan || '-'}
- Kapasitas Produksi: ${myProfile?.kapasitasBulanan || '-'}
- Skor BLUE SUSTAINABILITY CHECK Terakhir: ${lastAss ? `${lastAss.totalScore}% (${lastAss.categoryLabel})` : 'Belum asesmen'}
- Simulasi Ekonomi Terakhir: ${lastSim ? `Biaya awal Rp ${lastSim.totalAwal?.toLocaleString('id-ID')}, estimasi potensi hemat Rp ${lastSim.totalHemat?.toLocaleString('id-ID')}/bulan` : 'Belum ada'}
- Monitoring Terakhir: ${lastMon ? `Periode ${lastMon.periode}, penghematan aktual Rp ${lastMon.penghematanAktualRp?.toLocaleString('id-ID')}` : 'Belum ada'}
            `.trim();
          }

          const systemInstruction = `
Anda adalah BIRU ASSIST, asisten pintar pendamping UMKM pengolahan hasil perikanan di Kabupaten Indramayu dalam platform SIGAP BIRU.
Fokus keahlian Anda:
1. Pengelolaan limbah padat dan cair pengolahan ikan/udang/rumput laut.
2. Pemanfaatan hasil samping perikanan (kepala ikan, tulang, kulit, sisik, kepala/kulit udang) menjadi produk bernilai tambah ekonomi.
3. Efisiensi penggunaan air, listrik, gas LPG/bahan bakar, bahan baku, dan kemasan.
4. Pengembangan bisnis biru pesisir Kabupaten Indramayu.

Aturan Penulisan dan Karakter Jawaban:
- Gunakan bahasa Indonesia yang alami, ramah, jelas, praktis, dan mudah dipahami pelaku UMKM.
- JANGAN menggunakan tanda pagar (#, ##, ###) atau simbol bintang berlebihan (***).
- Gunakan paragraf pendek dengan jarak baris yang nyaman.
- Gunakan penomoran (1., 2., 3.) atau poin sederhana apabila diperlukan.
- Bedakan secara tegas antara fakta, estimasi, simulasi, dan asumsi.

${contextBlock}
          `.trim();

          const recentHistory = updatedMessages.slice(-6).map((m) => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.text }]
          }));

          if (currentAttachment && recentHistory.length > 0) {
            const lastIdx = recentHistory.length - 1;
            recentHistory[lastIdx].parts.push({
              inlineData: {
                mimeType: currentAttachment.mimeType,
                data: currentAttachment.base64
              }
            });
          }

          const apiKey = '';
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

          let responseText = '';
          let lastError = null;
          const delays = [800, 1500];

          for (let attempt = 0; attempt <= delays.length; attempt++) {
            try {
              const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  systemInstruction: { parts: [{ text: systemInstruction }] },
                  contents: recentHistory
                })
              });

              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const data = await res.json();
              responseText =
                data?.candidates?.[0]?.content?.parts?.[0]?.text ||
                'Maaf, saya belum dapat menghasilkan jawaban untuk pertanyaan tersebut.';
              break;
            } catch (err) {
              lastError = err;
              if (attempt < delays.length) {
                await new Promise((r) => setTimeout(r, delays[attempt]));
              }
            }
          }

          if (!responseText && lastError) {
            responseText =
              'Berikut panduan praktis BIRU ASSIST untuk UMKM pengolahan hasil perikanan di Kabupaten Indramayu:\n\n1. Pemisahan Hasil Samping Sejak Awal: Pisahkan kepala ikan, tulang, sisik, atau kulit udang pada wadah bersih terpisah saat penyiangan agar tidak tercampur kotoran lantai.\n2. Pengolahan Nilai Tambah: Kepala dan kulit udang dapat disangrai/dikeringkan menjadi bubuk kaldu udang alami atau kitosan, sedangkan tulang ikan dapat direbus bertekanan (presto) dan digiling menjadi tepung tulang kaya kalsium untuk campuran kerupuk.\n3. Pengelolaan Air Cucian: Pasang saringan kasa bertingkat dan bak pengendap lemak sederhana sebelum air cucian dialirkan agar tidak menimbulkan bau di lingkungan pesisir.';
          }

          const assistantMsg = {
            role: 'assistant',
            text: responseText,
            timestamp: new Date().toISOString()
          };

          const finalMessages = [...updatedMessages, assistantMsg];
          setMessages(finalMessages);

          const title = questionText.slice(0, 48) || 'Konsultasi Gambar UMKM';
          if (activeSessionId) {
            const updatedChats = myChats.map((c) =>
              c.id === activeSessionId ? { ...c, messages: finalMessages, updatedAt: new Date().toISOString() } : c
            );
            setMyChats(updatedChats);
            saveLocal('chat_sessions', updatedChats);
          } else {
            const newId = 'chat_' + Date.now();
            const newChat = { id: newId, title, messages: finalMessages, updatedAt: new Date().toISOString() };
            const updatedChats = [newChat, ...myChats];
            setMyChats(updatedChats);
            saveLocal('chat_sessions', updatedChats);
            setActiveSessionId(newId);
          }
        } catch (err) {
          console.error('BIRU ASSIST error:', err);
          showToast('Terjadi kendala saat menghubungi BIRU ASSIST.', 'error');
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <div className="lg:col-span-4 space-y-4">
            <div className="bg-white p-4 rounded-xl border border-sky-200 shadow-xs space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-sky-600 text-yellow-300 flex items-center justify-center font-bold">
                    <Sparkles className="w-4 h-4" />
                  </div>
                  <div>
                    <h2 className="text-sm font-extrabold text-slate-900">BIRU ASSIST</h2>
                    <p className="text-[11px] text-slate-500">Asisten AI Bisnis Biru Perikanan</p>
                  </div>
                </div>
                <button
                  onClick={handleStartNewChat}
                  className="text-xs bg-yellow-300 hover:bg-yellow-200 text-slate-950 font-extrabold px-3 py-1.5 rounded-lg flex items-center gap-1"
                >
                  <Plus className="w-3.5 h-3.5" />
                  <span>Baru</span>
                </button>
              </div>

              <label className="flex items-start gap-2 p-2.5 rounded-lg bg-sky-50 border border-sky-200 text-xs cursor-pointer">
                <input
                  type="checkbox"
                  checked={useProfileContext}
                  onChange={(e) => setUseProfileContext(e.target.checked)}
                  className="mt-0.5 rounded text-sky-600"
                />
                <div>
                  <span className="font-bold text-slate-800 block">Gunakan Konteks Profil UMKM</span>
                  <span className="text-[11px] text-slate-500">
                    Sesuaikan saran AI dengan jenis produk, kapasitas, dan hasil BLUE SUSTAINABILITY CHECK Anda.
                  </span>
                </div>
              </label>

              <div className="space-y-1.5">
                <div className="text-[11px] font-bold text-slate-500 uppercase">Contoh Pertanyaan Cepat:</div>
                {samplePrompts.map((sp, i) => (
                  <button
                    key={i}
                    onClick={() => handleSendMessage(sp)}
                    className="w-full text-left text-xs p-2.5 rounded-lg bg-sky-50/70 hover:bg-sky-100/80 text-sky-950 border border-sky-200 transition leading-snug"
                  >
                    &ldquo;{sp}&rdquo;
                  </button>
                ))}
              </div>
            </div>

            <div className="bg-white p-4 rounded-xl border border-sky-200 shadow-xs space-y-2">
              <div className="text-xs font-bold text-slate-700 uppercase">
                Riwayat Percakapan ({myChats.length})
              </div>
              {myChats.length === 0 ? (
                <p className="text-xs text-slate-400 py-2">Belum ada riwayat percakapan tersimpan.</p>
              ) : (
                <div className="space-y-1.5 max-h-56 overflow-y-auto">
                  {myChats.map((c) => (
                    <button
                      key={c.id}
                      onClick={() => handleLoadSession(c)}
                      className={`w-full text-left p-2.5 rounded-lg text-xs border transition ${
                        activeSessionId === c.id
                          ? 'bg-sky-50 border-sky-400 font-bold text-sky-950'
                          : 'bg-slate-50 hover:bg-sky-50/50 border-slate-200 text-slate-700'
                      }`}
                    >
                      <div className="truncate">{c.title}</div>
                      <div className="text-[10px] text-slate-400 mt-0.5">
                        {new Date(c.updatedAt).toLocaleString('id-ID')}
                      </div>
                    </button>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="lg:col-span-8 bg-white rounded-xl border border-sky-200 shadow-xs flex flex-col h-[580px]">
            <div className="p-4 border-b border-sky-100 flex items-center justify-between bg-sky-50/50 rounded-t-xl">
              <div>
                <span className="text-xs font-bold text-slate-800">Ruang Konsultasi Bebas BIRU ASSIST</span>
                <p className="text-[11px] text-slate-500">
                  Jawaban ditampilkan secara terstruktur, bersih, dan mudah dibaca pelaku UMKM.
                </p>
              </div>
              <span className="text-[11px] bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full">
                Gemini AI Aktif
              </span>
            </div>

            <div className="flex-1 p-4 overflow-y-auto space-y-4">
              {messages.map((m, idx) => (
                <div
                  key={idx}
                  className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}
                >
                  <div
                    className={`max-w-[85%] rounded-2xl px-4 py-3.5 text-xs sm:text-sm ${

              {isGenerating && (
                <div className="flex justify-start">
                  <div className="bg-sky-50 border border-sky-200 text-sky-800 rounded-2xl px-4 py-3 text-xs flex items-center gap-2">
                    <RefreshCw className="w-4 h-4 animate-spin text-sky-600" />
                    <span>BIRU ASSIST sedang menyusun solusi untuk usaha Anda...</span>
                  </div>
                </div>
              )}
            </div>

            <div className="p-3.5 border-t border-sky-100 bg-sky-50/40 rounded-b-xl space-y-2">
              {attachedImage && (
                <div className="flex items-center justify-between bg-sky-50 border border-sky-200 px-3 py-1.5 rounded-lg text-xs">
                  <span className="font-semibold text-sky-900">Foto siap dikirim bersama pertanyaan</span>
                  <button
                    onClick={() => setAttachedImage(null)}

                    Hapus Foto
                  </button>
                </div>
              )}

              <div className="flex items-center gap-2">
                <label
                  className="p-2.5 rounded-xl bg-white hover:bg-sky-50 border border-sky-200 text-sky-700 cursor-pointer transition shrink-0"
                  title="Unggah foto bahan baku / limbah / kemasan"

                  <Send className="w-4 h-4 text-yellow-300" />
                  <span>Kirim</span>

    const COMMODITY_OPTIONS = [
      'Ikan laut',

      'Kepiting',

    function SimulasiEkonomiView({ user, myProfile, mySimulations, setMySimulations, setActiveTab, showToast }) {
      const [selectedCommodity, setSelectedCommodity] = useState('Ikan laut');
      const [customCommodity, setCustomCommodity] = useState('');

      const [costs, setCosts] = useState({
        bahanBaku: '',
        air: '',
        listrik: '',
        gasBahanBakar: '',
        tenagaKerja: '',
        kemasan: '',
        limbah: '',
        operasionalLainnya: '',
        modalInvestasi: ''
      });

      const [assumptions, setAssumptions] = useState({
        persenHematAir: 15,
        persenHematEnergi: 12,
        persenHematKemasan: 10,
        persenEfisiensiBahanBaku: 5,
        pendapatanHasilSamping: ''
      });

      const calculation = useMemo(() => {
        const bBahan = Number(costs.bahanBaku) || 0;
        const bAir = Number(costs.air) || 0;
        const bListrik = Number(costs.listrik) || 0;
        const bGas = Number(costs.gasBahanBakar) || 0;
        const bTenagaKerja = Number(costs.tenagaKerja) || 0;
        const bKemasan = Number(costs.kemasan) || 0;
        const bLimbah = Number(costs.limbah) || 0;
        const bLainnya = Number(costs.operasionalLainnya) || 0;
        const modal = Number(costs.modalInvestasi) || 0;

        const totalAwal =
          bBahan + bAir + bListrik + bGas + bTenagaKerja + bKemasan + bLimbah + bLainnya;

        const hematAir = Math.round(bAir * ((Number(assumptions.persenHematAir) || 0) / 100));
        const hematEnergi = Math.round((bListrik + bGas) * ((Number(assumptions.persenHematEnergi) || 0) / 100));
        const hematKemasan = Math.round(bKemasan * ((Number(assumptions.persenHematKemasan) || 0) / 100));
        const hematBahan = Math.round(bBahan * ((Number(assumptions.persenEfisiensiBahanBaku) || 0) / 100));

        const totalHematBiaya = hematAir + hematEnergi + hematKemasan + hematBahan;
        const totalSetelahPerbaikan = Math.max(0, totalAwal - totalHematBiaya);
        const tambahanHasilSamping = Number(assumptions.pendapatanHasilSamping) || 0;
        const manfaatEkonomiBersihBulanan = totalHematBiaya + tambahanHasilSamping;

        let paybackMonths = null;
        if (modal > 0 && manfaatEkonomiBersihBulanan > 0) {
          paybackMonths = (modal / manfaatEkonomiBersihBulanan).toFixed(1);
        }

        return {
          totalAwal,
          hematAir,
          hematEnergi,
          hematKemasan,
          hematBahan,
          totalHematBiaya,
          totalSetelahPerbaikan,
          tambahanHasilSamping,
          manfaatEkonomiBersihBulanan,
          modal,
          paybackMonths
        };
      }, [costs, assumptions]);

      const handleSaveSimulation = async () => {
        if (!user) return;

    // ============================================================================
    // BAGIAN 6: MONITORING TRANSFORMASI UMKM & RENCANA AKSI
    // ============================================================================
    function MonitoringView({
      user,
      myProfile,
      myMonitorings,
      setMyMonitorings,
      myActionPlans,
      setMyActionPlans,
      publicUmkms,
      setPublicUmkms,
      setActiveTab,
      showToast
    }) {
      const [form, setForm] = useState({
        periode: new Date().toISOString().slice(0, 7),
        penghematanAktualRp: '',
        pendapatanHasilSampingRp: '',
        biayaPerSatuanRp: '',
        penggunaanAirM3: '',
        penggunaanEnergiKwh: '',
        limbahPadatKg: '',
        hasilSampingDimanfaatkanKg: '',
        statusAirLimbah: 'Disaring Sederhana',
        praktikBaru: ''
      });

      const [newPlanText, setNewPlanText] = useState('');
      const [newPlanSource, setNewPlanSource] = useState('Rekomendasi BIRU ASSIST');

      const handleAddMonitoring = async (e) => {
        e.preventDefault();
        if (!user) return;
        if (!form.periode || !form.praktikBaru.trim()) {
          showToast('Mohon isi periode bulan dan catatan praktik perbaikan yang diterapkan.', 'warning');
          return;
        }

        const newRecord = {
          id: 'mon_' + Date.now(),
          uid: user.uid,
          namaUmkm: myProfile?.namaUmkm || 'UMKM Mandiri',
          ...form,
          penghematanAktualRp: Number(form.penghematanAktualRp) || 0,
          pendapatanHasilSampingRp: Number(form.pendapatanHasilSampingRp) || 0,
          biayaPerSatuanRp: Number(form.biayaPerSatuanRp) || 0,
          penggunaanAirM3: Number(form.penggunaanAirM3) || 0,
          penggunaanEnergiKwh: Number(form.penggunaanEnergiKwh) || 0,
          limbahPadatKg: Number(form.limbahPadatKg) || 0,
          hasilSampingDimanfaatkanKg: Number(form.hasilSampingDimanfaatkanKg) || 0,
          createdAt: new Date().toISOString()
        };

        const updatedMon = [...myMonitorings, newRecord];
        setMyMonitorings(updatedMon);
        saveLocal('monitorings', updatedMon);

        if (myProfile?.id) {
          const updatedUmkms = publicUmkms.map((u) =>
            u.id === myProfile.id ? { ...u, isTransforming: true } : u
          );
          setPublicUmkms(updatedUmkms);
          saveLocal('umkm_registry', updatedUmkms);
        }

        if (hasFirebaseEnv && db) {
          try {
            const monColRef = collection(db, 'artifacts', appId, 'users', user.uid, 'monitorings');
            await addDoc(monColRef, newRecord);
            if (myProfile?.id) {
              const umkmRef = doc(db, 'artifacts', appId, 'public', 'data', 'umkm_registry', myProfile.id);
              await updateDoc(umkmRef, { isTransforming: true });
            }
          } catch (err) {}
        }

        setForm((prev) => ({
          ...prev,
          penghematanAktualRp: '',
          pendapatanHasilSampingRp: '',
          biayaPerSatuanRp: '',
          penggunaanAirM3: '',
          penggunaanEnergiKwh: '',
          limbahPadatKg: '',
          hasilSampingDimanfaatkanKg: '',
          praktikBaru: ''
        }));
        showToast('Catatan monitoring aktual berhasil disimpan.', 'success');
      };

      const handleAddActionPlan = async (e) => {
        e.preventDefault();
        if (!user || !newPlanText.trim()) return;
        const newPlan = {
          id: 'plan_' + Date.now(),
          title: newPlanText.trim(),
          source: newPlanSource,
          status: 'Belum dimulai',
          createdAt: new Date().toISOString()
        };
        const updated = [newPlan, ...myActionPlans];
        setMyActionPlans(updated);
        saveLocal('action_plans', updated);
        setNewPlanText('');
        showToast('Rencana aksi berhasil ditambahkan.', 'success');
      };

      const handleUpdatePlanStatus = async (planId, newStatus) => {
        const updated = myActionPlans.map((p) => (p.id === planId ? { ...p, status: newStatus } : p));
        setMyActionPlans(updated);
        saveLocal('action_plans', updated);
      };

      const firstRecord = myMonitorings[0];
      const latestRecord = myMonitorings[myMonitorings.length - 1];

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs">
            <h1 className="text-xl font-bold text-slate-900 flex items-center gap-2">
              <TrendingUp className="w-6 h-6 text-sky-600" />
              <span>Monitoring Transformasi Aktual & Rencana Aksi UMKM</span>
            </h1>

    // ============================================================================
    // BAGIAN 7: PENDAFTARAN DAN PROFIL UMKM
    // ============================================================================
    function ProfilUmkmView({
      user,
      myProfile,
      setMyProfile,
      publicUmkms,
      setPublicUmkms,
      siteSettings,
      myAssessments,
      myChats,
      myMonitorings,
      myActionPlans,
      setActiveTab,
      showToast
    }) {
      const [formData, setFormData] = useState({
        namaPemilik: '',
        teleponWa: '',
        email: '',
        kataSandiAkun: '',
        namaUmkm: '',
        jenisUsaha: DEFAULT_CATEGORIES[0],
        produkUtama: '',
        alamatUsaha: '',
        kecamatan: DEFAULT_KECAMATAN[0].name,
        desa: '',
        lamaUsahaTahun: '',
        kapasitasBulanan: '',
        sumberBahanBaku: '',
        jumlahTenagaKerja: '',
        lat: -6.3276,
        lng: 108.3249,
        locationConfirmed: true,
        dataUsageConsent: false,
        publicConsent: true,
        capacityConsent: true,
        scoreConsent: true
      });

      const [addressSearch, setAddressSearch] = useState('');
      const [saving, setSaving] = useState(false);
      const pickerMapRef = useRef(null);
      const leafletPickerInstance = useRef(null);
      const pickerMarkerRef = useRef(null);

      useEffect(() => {
        if (myProfile) {
          setFormData((prev) => ({
            ...prev,
            ...myProfile,
            locationConfirmed: true,
            dataUsageConsent: true
          }));
        }
      }, [myProfile]);

      useEffect(() => {
        if (!window.L || !pickerMapRef.current) return;
        const L = window.L;
        const latNum = Number(formData.lat);
        const lngNum = Number(formData.lng);
        const validLat = !Number.isNaN(latNum) && latNum >= -11 && latNum <= 6 ? latNum : -6.3276;
        const validLng = !Number.isNaN(lngNum) && lngNum >= 95 && lngNum <= 141 ? lngNum : 108.3249;

        const hotPinkPin = L.divIcon({
          className: 'custom-profile-pink-pin',
          html: `
            <div style="
              width: 24px;
              height: 24px;
              background: #FF1493;
              border: 3px solid #FFFFFF;
              border-radius: 9999px;
              box-shadow: 0 3px 10px rgba(255, 20, 147, 0.55), 0 1px 4px rgba(0,0,0,0.4);
              display: flex;
              align-items: center;
              justify-content: center;
            ">
              <div style="width: 7px; height: 7px; background: #FFFFFF; border-radius: 9999px;"></div>
            </div>
          `,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        if (!leafletPickerInstance.current) {
          const map = L.map(pickerMapRef.current, {
            center: [validLat, validLng],
            zoom: 13
          });
          L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=id&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: 'Peta Otomatisasi Koordinat UMKM'
          }).addTo(map);

          const marker = L.marker([validLat, validLng], {
            draggable: true,
            icon: hotPinkPin
          }).addTo(map);

          marker.on('dragend', () => {
            const pos = marker.getLatLng();
            setFormData((prev) => ({
              ...prev,
              lat: Number(pos.lat.toFixed(6)),
              lng: Number(pos.lng.toFixed(6)),
              locationConfirmed: true
            }));
          });

          map.on('click', (e) => {
            marker.setLatLng(e.latlng);
            setFormData((prev) => ({
              ...prev,
              lat: Number(e.latlng.lat.toFixed(6)),
              lng: Number(e.latlng.lng.toFixed(6)),
              locationConfirmed: true
            }));
          });

          leafletPickerInstance.current = map;
          pickerMarkerRef.current = marker;
          setTimeout(() => map.invalidateSize(), 200);
        } else {
          pickerMarkerRef.current?.setLatLng([validLat, validLng]);
          leafletPickerInstance.current.panTo([validLat, validLng]);
        }
      }, [formData.lat, formData.lng]);

      const handleGetGpsLocation = () => {
        if (!navigator.geolocation) {
          showToast('Perangkat Anda tidak mendukung fitur GPS.', 'warning');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const newLat = Number(pos.coords.latitude.toFixed(6));
            const newLng = Number(pos.coords.longitude.toFixed(6));
            setFormData((prev) => ({ ...prev, lat: newLat, lng: newLng, locationConfirmed: true }));
            if (leafletPickerInstance.current && pickerMarkerRef.current) {
              leafletPickerInstance.current.setView([newLat, newLng], 16);
              pickerMarkerRef.current.setLatLng([newLat, newLng]);
            }
            showToast('Koordinat GPS berhasil diambil dan otomatis memperbarui titik pada peta.', 'success');
          },
          () => {
            showToast('Izin lokasi ditolak atau GPS tidak dapat dijangkau. Silakan isi koordinat atau pilih di peta.', 'warning');
          }
        );
      };

      const handleSearchAddress = async () => {
        if (!addressSearch.trim()) return;
        try {
          const q = encodeURIComponent(`${addressSearch}, Indramayu, Jawa Barat`);
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=1`);
          const data = await res.json();
          if (data && data.length > 0) {
            const newLat = Number(parseFloat(data[0].lat).toFixed(6));
            const newLng = Number(parseFloat(data[0].lon).toFixed(6));
            setFormData((prev) => ({ ...prev, lat: newLat, lng: newLng, locationConfirmed: true }));
            if (leafletPickerInstance.current && pickerMarkerRef.current) {
              leafletPickerInstance.current.setView([newLat, newLng], 15);
              pickerMarkerRef.current.setLatLng([newLat, newLng]);
            }
            showToast('Lokasi ditemukan dan titik koordinat otomatis diperbarui.', 'info');
          } else {
            showToast('Alamat tidak ditemukan secara spesifik. Silakan isi koordinat atau pilih kecamatan.', 'warning');
          }
        } catch (e) {
          showToast('Gagal mencari alamat, silakan isi koordinat lintang dan bujur.', 'warning');
        }
      };

      const handleSubmitRegistration = async (e) => {
        e.preventDefault();
        if (!user) return;
        if (!formData.namaPemilik.trim() || !formData.namaUmkm.trim() || !formData.teleponWa.trim()) {
          showToast('Mohon lengkapi nama pemilik, nomor WhatsApp, dan nama UMKM.', 'warning');
          return;
        }

        const latNum = Number(formData.lat);
        const lngNum = Number(formData.lng);
        if (Number.isNaN(latNum) || Number.isNaN(lngNum) || latNum < -11 || latNum > 6 || lngNum < 95 || lngNum > 141) {
          showToast('Koordinat Lintang/Bujur tidak valid untuk wilayah Indonesia.', 'warning');
          return;
        }

        if (!formData.dataUsageConsent) {
          showToast('Mohon setujui ketentuan penggunaan data untuk melanjutkan pendaftaran.', 'warning');
          return;
        }

        setSaving(true);
        try {
          let nextStatus = 'Menunggu Verifikasi';
          if (myProfile) {
            const latChanged = Math.abs(Number(myProfile.lat) - latNum) > 0.0001;
            const lngChanged = Math.abs(Number(myProfile.lng) - lngNum) > 0.0001;
            if (myProfile.statusVerifikasi === 'Terverifikasi' && !latChanged && !lngChanged) {
              nextStatus = 'Terverifikasi';
            }
          }

          const docId = myProfile?.id || `umkm_${user.uid}`;
          const payload = {
            id: docId,
            ownerUid: user.uid,
            namaPemilik: formData.namaPemilik.trim(),
            teleponWa: formData.teleponWa.trim(),
            email: formData.email.trim(),
            namaUmkm: formData.namaUmkm.trim(),
            jenisUsaha: formData.jenisUsaha,
            produkUtama: formData.produkUtama.trim(),
            alamatUsaha: formData.alamatUsaha.trim(),
            kecamatan: formData.kecamatan,
            desa: formData.desa.trim(),
            lamaUsahaTahun: formData.lamaUsahaTahun,
            kapasitasBulanan: formData.kapasitasBulanan.trim(),
            sumberBahanBaku: formData.sumberBahanBaku.trim(),
            jumlahTenagaKerja: formData.jumlahTenagaKerja,
            lat: latNum,
            lng: lngNum,
            publicConsent: Boolean(formData.publicConsent),
            capacityConsent: Boolean(formData.capacityConsent),
            scoreConsent: Boolean(formData.scoreConsent),
            statusVerifikasi: nextStatus,
            catatanVerifikasi:
              nextStatus === 'Menunggu Verifikasi'
                ? 'Titik lokasi otomatis dibuat pada BLUE MAP (Status: Belum Terverifikasi).'
                : myProfile?.catatanVerifikasi || '',
            updatedAt: new Date().toISOString(),
            createdAt: myProfile?.createdAt || new Date().toISOString()
          };

          setMyProfile(payload);
          const exists = publicUmkms.some((u) => u.id === docId);
          const nextUmkms = exists
            ? publicUmkms.map((u) => (u.id === docId ? payload : u))
            : [...publicUmkms, payload];
          setPublicUmkms(nextUmkms);
          saveLocal('umkm_registry', nextUmkms);

          if (hasFirebaseEnv && db) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'umkm_registry', docId);
            await setDoc(docRef, payload, { merge: true });
          }

          showToast('Data & titik koordinat UMKM berhasil disimpan secara otomatis ke BLUE MAP!', 'success');
        } catch (err) {
          console.error(err);
          showToast('Data UMKM berhasil disimpan.', 'success');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white p-5 rounded-xl border border-sky-200 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-xl font-bold text-slate-900 flex items-center gap-2">
                <Building2 className="w-6 h-6 text-sky-600" />
                <span>{myProfile ? 'Profil & Pengelolaan Data UMKM Saya' : 'Pendaftaran Mandiri Akun & Lokasi UMKM'}</span>
              </h1>
              <p className="text-xs text-slate-500 mt-0.5">
                Saat Anda mengisi koordinat lintang dan bujur, sistem otomatis membuat dan memperbarui titik lokasi berwarna pink cerah di BLUE MAP.
              </p>
            </div>

            {myProfile && (
              <div className="flex flex-col items-end">
                <span
                  className={`text-xs font-extrabold px-3.5 py-1.5 rounded-full border ${
                    myProfile.statusVerifikasi === 'Terverifikasi'
                      ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                      : myProfile.statusVerifikasi === 'Perlu Perbaikan'
                      ? 'bg-amber-100 text-amber-900 border-amber-300'
                      : 'bg-sky-100 text-sky-800 border-sky-300'
                  }`}
                >
                  Status: {myProfile.statusVerifikasi === 'Menunggu Verifikasi' ? 'Belum Terverifikasi' : myProfile.statusVerifikasi}
                </span>
                {myProfile.catatanVerifikasi && (
                  <span className="text-[11px] text-slate-500 mt-1 max-w-xs text-right">
                    Ket: {myProfile.catatanVerifikasi}
                  </span>
                )}
              </div>
            )}
          </div>

          {myProfile && (
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
              <div className="bg-white p-4 rounded-xl border border-sky-200 shadow-xs text-xs">
                <span className="text-slate-500">BLUE SUSTAINABILITY CHECK</span>
                <div className="text-lg font-extrabold text-sky-700 mt-1">
                  {myAssessments[0] ? `${myAssessments[0].totalScore}%` : 'Belum Ada'}
                </div>
                <button onClick={() => setActiveTab('asesmen')} className="text-sky-700 underline mt-1 font-semibold">
                  Lihat Riwayat ({myAssessments.length})
                </button>
              </div>
              <div className="bg-white p-4 rounded-xl border border-sky-200 shadow-xs text-xs">
                <span className="text-slate-500">Sesi Konsultasi AI</span>
                <div className="text-lg font-extrabold text-slate-900 mt-1">{myChats.length} Sesi</div>
                <button onClick={() => setActiveTab('assist')} className="text-sky-700 underline mt-1 font-semibold">
                  Buka BIRU ASSIST
                </button>
              </div>
              <div className="bg-white p-4 rounded-xl border border-sky-200 shadow-xs text-xs">

      const [lockoutUntil, setLockoutUntil] = useState(0);
      const [remainingLockSeconds, setRemainingLockSeconds] = useState(0);

      useEffect(() => {
        if (!lockoutUntil) return;
        const interval = setInterval(() => {
          const diff = Math.ceil((lockoutUntil - Date.now()) / 1000);
          if (diff <= 0) {
            setLockoutUntil(0);
            setRemainingLockSeconds(0);
            setFailedAttempts(0);
            clearInterval(interval);
          } else {
            setRemainingLockSeconds(diff);
          }
        }, 500);
        return () => clearInterval(interval);

        e.preventDefault();
        setErrorMessage('');

        if (lockoutUntil && Date.now() < lockoutUntil) {
          setErrorMessage(`Terlalu banyak percobaan login gagal. Silakan tunggu ${remainingLockSeconds} detik lagi.`);
          return;
        }

        const cleanEmail = emailInput.trim().toLowerCase();
        const cleanPass = passwordInput.trim();
        const cleanPin = pinInput.trim();

        setLoading(true);

          const isDirectMatch =
            cleanEmail === 'pengelolasigapbiru@gmail.com' &&
            cleanPass === 'sigapbiruterbaru2026' &&

          if (!isDirectMatch && typeof crypto !== 'undefined' && crypto.subtle) {
            try {
              const [inputEmailHash, inputPassHash, inputPinHash] = await Promise.all([
                sha256Hash(cleanEmail),
                sha256Hash(cleanPass),
                sha256Hash(cleanPin)
              ]);
              isHashMatch =
                inputEmailHash === AUTHORIZED_ADMIN_HASHES.emailHash &&
                inputPassHash === AUTHORIZED_ADMIN_HASHES.passwordHash &&
                inputPinHash === AUTHORIZED_ADMIN_HASHES.pinHash;

              isHashMatch = false;
            }
          }

              setLockoutUntil(lockTime);
              setRemainingLockSeconds(60);
